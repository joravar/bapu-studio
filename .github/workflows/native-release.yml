name: Native Rust Release

on:
  push:
    tags:
      - "v2.*"
      - "native-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: bapu-studio.exe
            archive: bapu-studio-windows-x64.zip
            portable: Bapu-Studio-Portable-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: bapu-studio
            archive: bapu-studio-macos-arm64.tar.gz
            portable: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: bapu-studio
            archive: bapu-studio-macos-x64.tar.gz
            portable: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: bapu-studio
            archive: bapu-studio-linux-x64.tar.gz
            portable: ""

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI & ODBC dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libdbus-1-dev unixodbc-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - name: Run workspace tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p bapu-app

      - name: Package Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "../dist-assets" | Out-Null
          Copy-Item -Force "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "../dist-assets/${{ matrix.portable }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -DestinationPath "../dist-assets/${{ matrix.archive }}" -Force

      - name: Package Unix tar.gz
        if: runner.os != 'Windows'
        run: |
          mkdir -p ../dist-assets
          tar -czf "../dist-assets/${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: dist-assets/*

  publish-release:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
