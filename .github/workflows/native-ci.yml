name: Native Rust CI

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-ci.yml"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - name: Lint workspace (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run full workspace unit & integration tests
        run: cargo test --workspace

      - name: Build release desktop binary
        run: cargo build --release -p bapu-app
