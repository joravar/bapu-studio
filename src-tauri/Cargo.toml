[package]
name = "bapu-studio"
version = "1.0.0"
description = "The honest, open-source, local-first developer cockpit for APIs, Databases, and Secrets."
authors = ["Bapu Studio Open Source Contributors"]
edition = "2021"

[lib]
name = "bapu_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
