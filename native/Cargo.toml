[workspace]
resolver = "2"
members = [
    "crates/bapu-core",
    "crates/bapu-app",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Joravar <support@bapustudio.dev>"]
repository = "https://github.com/joravar/bapu-studio"
homepage = "https://joravar.github.io/bapu-studio/"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
