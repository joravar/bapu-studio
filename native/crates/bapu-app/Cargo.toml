[package]
name = "bapu-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Bapu Studio desktop app — native Rust/egui rewrite of the Electron app."

[[bin]]
name = "bapu-studio"
path = "src/main.rs"

[dependencies]
bapu-core = { path = "../bapu-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11"
