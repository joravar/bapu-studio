[package]
name = "bapu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core data model, storage, secrets, database drivers, and script engine for Bapu Studio (native Rust rewrite)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
directories = "5"
async-trait = "0.1"

# OS-keychain-backed secret storage (Keychain / DPAPI / Secret Service), replacing Electron's safeStorage.
keyring = "3"

# HTTP client for API Studio.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "stream"] }

# Database drivers.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "chrono", "json"] }
mongodb = { version = "3", default-features = false, features = ["tokio-runtime"] }
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# Pure-Rust embeddable JS engine for the pre-request/test script sandbox (no filesystem, no
# network, no DOM unless we explicitly bind a function into its global scope).
boa_engine = "0.20"

# WebSocket client for Stream Studio.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
