[package]
name = "bapu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core data model, storage, secrets, database drivers, and script engine for Bapu Studio (native Rust rewrite)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
directories = "5"
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
url = "2.5"
form_urlencoded = "1.2"

# OS-keychain-backed secret storage (Keychain / DPAPI / Secret Service), replacing Electron's safeStorage.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# HTTP client for API Studio.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "stream"] }

# Database drivers (PostgreSQL, MySQL/MariaDB/TiDB, SQLite, MongoDB, Redis, MSSQL/Azure SQL,
# Oracle Net TNS, Cassandra/ScyllaDB CQL, and Universal ODBC for Db2/SAP HANA/Teradata/DuckDB/etc.).
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "chrono", "json"] }
mongodb = { version = "3", features = ["dns-resolver"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "tokio-rustls-comp"] }
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "chrono", "sql-browser-tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
oracle-rs = "0.1.7"
cdrs-tokio = { version = "10.0", features = ["rust-tls"] }

# Pure-Rust embeddable JS engine for the pre-request/test script sandbox (no filesystem, no
# network, no DOM unless we explicitly bind a function into its global scope).
boa_engine = "0.20"

# WebSocket client for Stream Studio.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Pure-Rust async SSH client for bastion/jump-host database tunneling.
russh = "0.49"

[target.'cfg(windows)'.dependencies]
# Windows ships `odbc32.dll` in System32 on every OS install.
odbc-api = { version = "30", default-features = false, features = ["odbc_version_3_80"] }

[target.'cfg(not(windows))'.dependencies]
# On macOS & Linux we dynamically load `libodbc` / `libiodbc` at runtime via `dlopen` so the
# app binary has zero compile-time `-lodbc` link dependency and passes Apple Notarization cleanly.
libloading = "0.8"
